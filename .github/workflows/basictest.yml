name: basictest

on:
  push:
  pull_request:
  schedule:
    - cron: '30 12 * * 1'  # 12:30 every Monday

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest,      CC: clang,    CXX: clang++,    python: "3.12", buildtype: 'Release' }
          - { os: macos-26-intel,    CC: clang,    CXX: clang++,    python: "3.11", buildtype: 'Release' }
    name: ${{ matrix.os }}.${{ matrix.CC }}.python-${{ matrix.python }}-${{ matrix.buildtype }}${{ matrix.minversions && '-minversions' || '' }}
    runs-on: ${{ matrix.os }}
    env:
      CC: ${{ matrix.CC }}
      CXX: ${{ matrix.CXX }}

    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        path: src

    - name: Setup python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
      with:
        python-version: ${{ matrix.python }}

    - name: Enable parallel cmake
      run: python ./src/devel/bin/mcpldevtool nprocs --enable-github-parallel

    - name: pip install deps
      run: pip install -r ./src/devel/reqs/requirements_devel.txt

    - name: pip install minimum versions of Python dependencies
      if: matrix.minversions
      #The minimum versions are taken from devel/dependency_database.yml
      #(e.g. "numpy>=1.22" becomes "numpy==1.22.*"):
      run: |
        python ./src/devel/bin/mcpldevtool depdb --mode minversions > minreqs.txt
        cat minreqs.txt
        pip install -r minreqs.txt
        pip check
        python -c 'import numpy,matplotlib; print(numpy.__version__, matplotlib.__version__)'

    - name: Virtual display for the tests of the viewer in a window (Xvfb, on Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y xvfb
        Xvfb :99 -screen 0 1600x1000x24 -nolisten tcp &
        echo "DISPLAY=:99" >> $GITHUB_ENV

    - name: Font caches of matplotlib and Tk (so tests do not wait for them)
      run: python ./src/devel/bin/mcpldevtool fontcache

    - name: Configure CMake
      run: >
        cmake
        -S ./src
        -B ./build
        "-DCMAKE_BUILD_TYPE=${{ matrix.buildtype }}"
        "-DCMAKE_INSTALL_PREFIX=./install"
        -DMCPL_ENABLE_TESTING=ON
        -DMCPL_BUILD_STRICT=ON
        -DMCTOOLS_REQUIRE_ALL_TEST_DEPS=ON

    - name: Build
      run: cmake --build ./build --config ${{ matrix.buildtype }}

    - name: CTest
      run: ctest --test-dir ./build --build-config ${{ matrix.buildtype }} --no-tests=error --output-on-failure --test-output-size-failed 100000 --test-output-truncation middle

    - name: Repeat pyviewer_tk (alone, and in parallel with the other viewer tests)
      if: always()
      run: |
        cd ./build
        diag() { grep -E 'Failed|NO KEYBOARD|focus in the pick|pick applied' "$1" | head -20; }
        alone=0; together=0
        for i in $(seq 15); do
          if ! ctest --build-config ${{ matrix.buildtype }} -R '^py_rl_pyviewer_tk$' --output-on-failure > alone_$i.log 2>&1; then
            alone=$((alone+1)); echo "== alone, run $i failed:"; diag alone_$i.log
          fi
        done
        for i in $(seq 6); do
          if ! ctest --build-config ${{ matrix.buildtype }} -j3 -R '^py_rl_pyviewer_tk$|^py_rl_pyviewer_monkey$|^py_rl_pyviewer$' --output-on-failure > together_$i.log 2>&1; then
            together=$((together+1)); echo "== in parallel, run $i failed:"; diag together_$i.log
          fi
        done
        echo "Failed runs: alone $alone of 15, in parallel with pyviewer and pyviewer_monkey $together of 6"
        [ $alone -eq 0 ] && [ $together -eq 0 ]

    - name: Install
      run: cmake --install ./build --config ${{ matrix.buildtype }}

    - name: Run mcpl-config
      run: ./install/bin/mcpl-config -s

    - name: Run mcpltool-c
      run: ./install/bin/mcpltool-c --help

    - name: Setup environment
      run: |
        test -f ./install/bin/mcpl-config
        test -f ./install/bin/mcpltool-c
        test -d ./install/lib
        echo "PATH=$PWD/install/bin:$PATH" >> $GITHUB_ENV
        echo "LD_LIBRARY_PATH=$PWD/install/lib:${LD_LIBRARY_PATH}" >> $GITHUB_ENV
        echo "DYLD_LIBRARY_PATH=$PWD/install/lib:${DYLD_LIBRARY_PATH}" >> $GITHUB_ENV

    - name: Run mcpl-config
      run: mcpl-config -s

    - name: Run mcpltool-c
      run: mcpltool-c --help

    - name: Check CMake variables of find_package(MCPL)
      run: cmake -S ./src/devel/misc/test_cmakevars -B ./build_cmakevars

    - name: Cfg downstream
      #For fun, always use Release config here, to test that it works even if
      #using a different build type than mcpl itself:
      run: cmake -S ./src/examples/downstream_cmake -B ./build_ds -DCMAKE_INSTALL_PREFIX=./install_ds -DCMAKE_BUILD_TYPE=Release

    - name: Build downstream
      run: cmake --build ./build_ds

    - name: Install downstream
      run: cmake --install ./build_ds

    - name: Run downstream
      run: ./install_ds/bin/testapp ./src/examples/example.mcpl
