name: extra

#The extra tests live in a private repository, which is checked out with a
#deploy key kept as a secret. Secrets are not available to pull_request runs of
#pull requests from forks, so this workflow runs on pull_request_target instead:
#it then runs in the context of this repository (with the secret, and with this
#workflow file as in the base branch rather than as in the pull request), but
#checks out the code of the pull request. In each job, the private repository
#is checked out right after the code (checkouts run no code from it), without
#persisting the key, so the key is gone from the runner before any step which
#runs code from the pull request, and the token has read-only permissions. Code
#from a pull request can thus at most read the extra tests themselves. The
#workflow is skipped for pushes in other repositories (forks), which do not
#have the secret, and fails if the secret is unavailable otherwise, since the
#extra tests must always run.

on:
  push:
  pull_request_target:
  schedule:
    - cron: '9 15 * * 3'  # 9:15 every Wednesday

permissions:
  contents: read

env:
  HAVE_EXTRA_TESTS_SECRET: ${{ secrets.ACCESS_TOKEN_MCPL_EXTRA_TESTS != '' }}
  #Code to test (the pull request head for pull_request_target, otherwise the
  #ref of the event):
  CHECKOUT_REF: ${{ github.event.pull_request.head.sha || '' }}

jobs:
  mcpldevtool_check:
    if: github.repository == 'mctools/mcpl' || github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Require the extra tests secret
        if: env.HAVE_EXTRA_TESTS_SECRET != 'true'
        run: |
          echo "::error::The ACCESS_TOKEN_MCPL_EXTRA_TESTS secret is not available, so the extra tests can not run (forks need a copy of it in their repository secrets)."
          exit 1

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: src
          ref: ${{ env.CHECKOUT_REF }}

      - name: Checkout extra tests
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: tkittel/mcpl-private-tests
          ssh-key: ${{ secrets.ACCESS_TOKEN_MCPL_EXTRA_TESTS }}
          path: src_extra
          persist-credentials: false

      - name: Enable parallel cmake
        run: python ./src/devel/bin/mcpldevtool nprocs --enable-github-parallel

      - name: Pip install packages for mcpldevtool
        run: pip install -r ./src/devel/reqs/requirements_devel.txt

      - name: mcpldevtool checks
        run: ./src/devel/bin/mcpldevtool check -n "fix""me"

      - name: Copy extra test repo for mcpldevtool coverage
        run: mv ./src_extra ./src/copy

      - name: mcpldevtool check extra test repo
        run: ./src/devel/bin/mcpldevtool check -n "fix""me"

  build:
    #(not run when mcpldevtool_check is skipped, due to needs)
    needs: [ mcpldevtool_check ]
    strategy:
      matrix:
        strictflag: [ 'ON', '11', '17' ]
        #NB (Apr2025): Leaving out windows-11-arm for now, since it gives
        #problems with the checkout with the private SSH tokens (looks like a
        #bug in github actions/checkout).
        os: [ubuntu-latest, macos-latest, windows-latest, ubuntu-24.04-arm, macos-15-intel ]

    name: ${{ matrix.os }}.strict${{ matrix.strictflag }}
    runs-on: ${{ matrix.os }}

    steps:
    - name: Require the extra tests secret
      if: env.HAVE_EXTRA_TESTS_SECRET != 'true'
      run: |
        echo "::error::The ACCESS_TOKEN_MCPL_EXTRA_TESTS secret is not available, so the extra tests can not run (forks need a copy of it in their repository secrets)."
        exit 1

    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        path: src
        ref: ${{ env.CHECKOUT_REF }}

    - name: Checkout extra tests
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: tkittel/mcpl-private-tests
        ssh-key: ${{ secrets.ACCESS_TOKEN_MCPL_EXTRA_TESTS }}
        path: src_extra
        persist-credentials: false

    - name: Setup python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
      with:
        python-version: '3.11'

    - name: Pip install extra packages
      run: pip install -r ./src/devel/reqs/requirements_devel.txt

    - name: Enable parallel cmake
      run: python ./src/devel/bin/mcpldevtool nprocs --enable-github-parallel

    - name: Install Ninja (Linux)
      if: runner.os == 'Linux'
      run: sudo apt-get install ninja-build

    - name: Install Ninja (macOS)
      if: runner.os == 'macOS'
      run: brew install ninja

    - name: Set CMAKE_GENERATOR (Linux/macOS)
      if: runner.os != 'Windows'
      run: echo "CMAKE_GENERATOR=Ninja Multi-Config" >> $GITHUB_ENV

    - name: Virtual display for the tests of the viewer in a window (Xvfb, on Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y xvfb
        Xvfb :99 -screen 0 1600x1000x24 -nolisten tcp &
        echo "DISPLAY=:99" >> $GITHUB_ENV

    - name: Font caches of matplotlib and Tk (so tests do not wait for them)
      run: python ./src/devel/bin/mcpldevtool fontcache

    - name: Configure CMake
      run: >
        cmake -S ./src -B ./build
        -DMCPL_ENABLE_TESTING=ON
        -DMCPL_BUILD_STRICT=${{ matrix.strictflag }}
        -DMCPLEXTRA_ADDITIONAL_TESTS=src_extra/testroot
        -DMCTOOLS_REQUIRE_ALL_TEST_DEPS=ON

    - name: Build Release
      run: cmake --build ./build --config Release

    - name: Build Debug
      run: cmake --build ./build --config Debug

    - name: CTest Release
      run: ctest --test-dir ./build  --build-config Release --no-tests=error --output-on-failure --test-output-size-failed 100000 --test-output-truncation middle

    - name: CTest Debug
      run: ctest --test-dir ./build  --build-config Debug --no-tests=error --output-on-failure --test-output-size-failed 100000 --test-output-truncation middle
