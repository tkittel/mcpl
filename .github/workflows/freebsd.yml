name: freebsd

on:
  push:
  pull_request:
  schedule:
    - cron: '30 18 * * 0'  # 18:30 every Sunday

jobs:
  mcpldevtool_check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: src
      - name: Enable parallel cmake
        run: python ./src/devel/bin/mcpldevtool nprocs --enable-github-parallel
      - name: Pip install packages for mcpldevtool
        run: pip install -r ./src/devel/reqs/requirements_devel.txt
      - name: mcpldevtool checks
        run: ./src/devel/bin/mcpldevtool check -n "fix""me"

  ctest:
    needs: [ mcpldevtool_check ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: src

      - name: Enable parallel cmake
        run: python ./src/devel/bin/mcpldevtool nprocs --enable-github-parallel

      - name: Start FreeBSD VM
        uses: cross-platform-actions/action@e0b9770014ba65d5e0815f15b74031c3a635f641
        with:
          environment_variables: CMAKE_BUILD_PARALLEL_LEVEL CTEST_PARALLEL_LEVEL
          operating_system: freebsd
          #Increase "memory" from 6G to 10G for bigfile ctests:
          #memory: 10G
          version: '15.1'

      - name: Build and test in the FreeBSD VM
        #(files are only copied to the VM, not back):
        shell: cpa.sh {0} --sync-files runner-to-vm
        run: |
            set -e
            df -h
            #Due to limited VM disk space, do not run tests in parallel (the
            #bigfile tests involve huge intermittent files):
            export CTEST_PARALLEL_LEVEL=1
            echo "CMAKE_BUILD_PARALLEL_LEVEL=${CMAKE_BUILD_PARALLEL_LEVEL}"
            echo "CTEST_PARALLEL_LEVEL=${CTEST_PARALLEL_LEVEL}"
            #Packages from the "latest" branch of FreeBSD (the "quarterly"
            #packages for amd64 sometimes lack some, like cmake-doc and
            #py312-matplotlib in October 2026):
            sudo mkdir -p /usr/local/etc/pkg/repos
            echo 'FreeBSD-ports: { url: "pkg+https://pkg.FreeBSD.org/${ABI}/latest" }' | sudo tee /usr/local/etc/pkg/repos/FreeBSD.conf
            sudo pkg update -f
            #The packages from devel/dependency_database.yml, for Python 3.12
            #(which is called as python3.12, as python3 can be another version):
            sudo pkg install -y devel/cmake-core python312 py312-pyyaml
            FREEBSD_PKGS=$(python3.12 ./src/devel/bin/mcpldevtool depdb --mode freebsdpkgs --pyflavour py312) || exit 1
            echo "FREEBSD_PKGS=${FREEBSD_PKGS}"
            sudo pkg install -y ${FREEBSD_PKGS}
            #(a virtual display with fonts, for the tests of the viewer in a
            #window):
            sudo pkg install -y xorg-vfbserver dejavu
            Xvfb :99 -screen 0 1600x1000x24 -nolisten tcp > /dev/null 2>&1 &
            export DISPLAY=:99
            sleep 2
            python3.12 ./src/devel/bin/mcpldevtool fontcache
            df -h
            sudo pkg autoremove -y
            df -h
            sudo pkg clean -a -y
            df -h
            python3.12 ./src/devel/bin/mcpldevtool check -n "fix""me"
            cmake -S ./src -B ./build -DCMAKE_BUILD_TYPE=Release -DMCPL_BUILD_STRICT=ON -DMCPL_ENABLE_TESTING=ON -DMCTOOLS_REQUIRE_ALL_TEST_DEPS=ON -DPython3_EXECUTABLE=$(which python3.12)
            cmake --build ./build --config Release
            df -h
            ctest --test-dir ./build --build-config Release --no-tests=error --output-on-failure --test-output-size-failed 100000 --test-output-truncation middle

  pipinst:
    needs: [ mcpldevtool_check ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: src

      - name: Enable parallel cmake
        run: python ./src/devel/bin/mcpldevtool nprocs --enable-github-parallel

      - name: Start FreeBSD VM
        uses: cross-platform-actions/action@e0b9770014ba65d5e0815f15b74031c3a635f641
        with:
          environment_variables: CMAKE_BUILD_PARALLEL_LEVEL CTEST_PARALLEL_LEVEL
          operating_system: freebsd
          version: '15.1'

      - name: Install with pip in the FreeBSD VM
        #(files are only copied to the VM, not back):
        shell: cpa.sh {0} --sync-files runner-to-vm
        run: |
            set -e
            echo "CMAKE_BUILD_PARALLEL_LEVEL=${CMAKE_BUILD_PARALLEL_LEVEL}"
            echo "CTEST_PARALLEL_LEVEL=${CTEST_PARALLEL_LEVEL}"
            #Packages from the "latest" branch of FreeBSD (the "quarterly"
            #packages for amd64 sometimes lack some, like cmake-doc and
            #py312-matplotlib in October 2026):
            sudo mkdir -p /usr/local/etc/pkg/repos
            echo 'FreeBSD-ports: { url: "pkg+https://pkg.FreeBSD.org/${ABI}/latest" }' | sudo tee /usr/local/etc/pkg/repos/FreeBSD.conf
            sudo pkg update -f
            #(packages for Python 3.12, as in the ctest job):
            sudo pkg install -y devel/cmake-core python312 py312-pyyaml py312-pip py312-setuptools py312-wheel py312-scikit-build-core
            FREEBSD_PKGS=$(python3.12 ./src/devel/bin/mcpldevtool depdb --mode freebsdpkgs --pyflavour py312) || exit 1
            echo "FREEBSD_PKGS=${FREEBSD_PKGS}"
            sudo pkg install -y ${FREEBSD_PKGS}
            #Make sure pip --user bin dir is in PATH:
            PATH="/home/runner/.local/bin:${PATH}"
            export PATH
            echo "PATH IS NOW: ${PATH}"
            python3.12 ./src/devel/bin/mcpldevtool check -n "fix""me"
            python3.12 -mpip install --user ./src/mcpl_python
            python3.12 -mpip show mcpl-python
            ls -l /home/runner/.local/bin
            which mcpltool
            mcpltool ./src/examples/example.mcpl
            python3.12 -mpip check
            python3.12 -mpip install --user -v ./src/mcpl_core
            python3.12 -mpip show mcpl-core
            python3.12 -mpip check
            mcpltool-c -h
            mcpltool-c ./src/examples/example.mcpl
            python3.12 -mpip install --user --no-build-isolation ./src/mcpl_metapkg
            python3.12 -mpip show mcpl
            python3.12 -mpip check
            python3.12 -mpip install --user scikit_build_core ./src/mcpl_extra --no-build-isolation
            mcpl2phits ./src/examples/example.mcpl foo.dmp
            phits2mcpl foo.dmp foo.mcpl
            mcpltool-c foo.mcpl.gz
