name: Build and publish documentation

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+' #pattern match
    branches:
      #The website is published from the branch tk_deploy_website:
      - tk_deploy_website
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub
# Pages. These were copied from workflows generated by the github UI.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run
# in-progress and latest queued. However, do NOT cancel in-progress runs as we
# want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    env:
      CONDA_SOLVER: libmamba

    steps:
    - name: Checkout main repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup conda environment
      uses: conda-incubator/setup-miniconda@be893c923ea9cf1cf7cd510fbdde27c7e18cbdcb # v4.1.0
      with:
        miniforge-version: latest
        channels: conda-forge
        conda-remove-defaults: true
        activate-environment: mcpl_doc
        environment-file: devel/reqs/conda_doc.yml

    - name: Virtual display and a Tk with Xft, for the picture of the viewer
      run: |
        sudo apt-get update
        sudo apt-get install -y xvfb
        Xvfb :99 -screen 0 1600x1000x24 -nolisten tcp &
        echo "DISPLAY=:99" >> $GITHUB_ENV
        #(the default Tk of conda-forge has no antialiased fonts):
        conda install -y "tk=*=xft_*" xorg-libxft

    - name: Build documentation
      #NB: --strict to turn warnings into errors:
      run: python ./devel/bin/mcpldevtool sphinx --strict

    - name: Upload artifact
      uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
      with:
        path: './doc/build/html'

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
