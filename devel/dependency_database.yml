# We need to specify dependencies in many different files (various
# pyproject.toml files, requirements.txt files, conda.yml files, the FreeBSD
# CI, the CTest configuration, ...). To keep everything synchronized, we define
# all the relationships in this one file, along with any version constraints
# (interdependency on mcpl-* pkgs will always happen with exact version
# pinning). The files depending on this are checked by "mcpldevtool check",
# and can be updated with "mcpldevtool depdb --mode fixreqfiles".
#
# Dependencies which can not be installed everywhere have the fields
# min_python (Python version needed by the package), unavailable_on (list of
# systems, as in platform.system() and CMAKE_SYSTEM_NAME, where the package
# can not be installed) and only_on (list of the only systems where it is
# needed, like Windows for windows-curses). They become environment markers in requirement
# specifications, and tests needing such dependencies are not added at all
# where they can not be installed (while missing dependencies are otherwise an
# error with MCTOOLS_REQUIRE_ALL_TEST_DEPS=ON). The freebsd_pkgname field gives
# the name of the FreeBSD package, with "{py}" for the Python flavour (like
# py312), for the FreeBSD CI.
#
# Dependencies without pip packages (like parts of Python which not all
# installations have) have pypi_pkgname: null, and are left out of the
# pyproject.toml and requirements files. The field check_code gives Python
# code which the tests run to see if a dependency works (instead of importing
# it), for dependencies which can be imported without working.

#Added to all the conda environment files, for building from source (pip at
#least 26.2.2, which no longer trusts the root certificate "emSign ECC Root CA
#- G3", see discuss.python.org/t/109576):
conda_env_tools:
  - c-compiler
  - cmake
  - make
  - pip >=26.2.2
  - python

packages:
  mcpl-core:
    tomlfiles:
      - mcpl_core/pyproject.toml
      - mcpl_core/empty_pypkg/pyproject.toml
  mcpl-python:
    tomlfiles:
      - mcpl_python/pyproject.toml
    deps:
      BASE:
        - numpy
      #(the viewer in a window needs tkinter):
      plot:
        - matplotlib
        - tkinter
      #(curses is in the standard library, except on Windows):
      curses:
        - windows-curses
      all:
        - ADD plot
        - ADD curses
      #(not in "all", since scipp needs a more recent Python and numpy):
      scipp:
        - scipp
  mcpl-extra:
    tomlfiles:
      - mcpl_extra/pyproject.toml
    deps:
      BASE:
        - mcpl-core
  mcpl-metapkg:
    tomlfiles:
      - mcpl_metapkg/pyproject.toml
    deps:
      BASE:
        - mcpl-core
        - mcpl-python
      #(extras of mcpl-python are forwarded):
      plot:
        - mcpl-python[plot]
      curses:
        - mcpl-python[curses]
      all:
        - mcpl-python[all]
      scipp:
        - mcpl-python[scipp]
      devel:
        - pyyaml
        - ruff
        - toml
        - "CMD <python> <reporoot>/devel/bin/mcpldevtool depdb --mode testdeps2json"

dependencies:
  toml:
    min_version: "2.0.0"
    import_check: tomli
    pypi_pkgname: tomli
    conda_pkgname: tomli
    in_pystdlib_from: "3.11"
    freebsd_pkgname: "{py}-tomli"
  matplotlib:
    min_version: "3.6"
    import_check: "matplotlib.pyplot"
    freebsd_pkgname: "{py}-matplotlib"
  numpy:
    min_version: "1.22"
    freebsd_pkgname: "{py}-numpy"
  windows-curses:
    min_version: "2.3"
    import_check: curses
    only_on: [ Windows ]
    #(not on conda-forge):
    conda_pkgname: null
  tkinter:
    #(part of Python, but not of all installations, so there is no pip
    #package; the tests check that Tk can open windows, so test jobs need a
    #display, like Xvfb on Linux and FreeBSD; no semicolons, as they separate
    #CMake list entries):
    pypi_pkgname: null
    conda_pkgname: tk
    check_code: "__import__('tkinter').Tk().destroy()"
    freebsd_pkgname: "{py}-tkinter"
  scipp:
    min_version: "26.9"
    min_python: "3.12"
    #(no FreeBSD package, and no wheels for FreeBSD on PyPI):
    unavailable_on: [ FreeBSD ]
  ruff:
    min_version: "0.8.1"
    import_check: null
    cmd_check: ruff
    freebsd_pkgname: ruff
  pyyaml:
    import_check: yaml
    pypi_pkgname: PyYAML
    conda_pkgname: pyyaml
    min_version: "6.0.0"
    freebsd_pkgname: "{py}-pyyaml"
