# A pyproject.toml for injecting an empty mcpl-core package. In case mcpl-core
# is installed in a non-python aware fashion, installing this empty mcpl-core
# package can be used to ensure that subsequent pip installations of packages
# needing mcpl-core will not cause pip to pull down mcpl-core from pypi. Of
# course, this is not bullet-proof, since "pip uninstall mcpl-core" will only
# uninstall the empty package, not all of mcpl-core content.

[build-system]
requires = ["setuptools>=77.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "mcpl-core"
version = "2.2.9"
requires-python = ">=3.9"
readme = "README.md"
license = "Apache-2.0"
authors = [
  { name="MCPL developers (Thomas Kittelmann, et. al.)" },
]
description = "Utilities and API for accessing MCPL (.mcpl) files"
classifiers = [
    "Programming Language :: Python :: 3",
]

[project.urls]
"Homepage" = "https://mctools.github.io/mcpl/"
"Bug Tracker" = "https://github.com/mctools/mcpl/issues"
