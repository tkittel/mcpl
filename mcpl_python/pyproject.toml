[build-system]
requires = ["setuptools>=75.3.2"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = {attr = "mcpl.__version__"}

[project]
name = "mcpl-python"
dynamic = [ 'version' ]
requires-python = ">=3.9"
dependencies = [ 'numpy>=1.22' ]
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [
  { name="MCPL developers (Thomas Kittelmann, et. al.)" },
]
description = "Utilities and API for accessing MCPL (.mcpl) files"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
]

[project.optional-dependencies]
#Plotting backends (the text backends need no extra packages):
plot = [ 'matplotlib>=3.6' ]
#The viewer in the terminal (curses is in the standard library of Python,
#except on Windows):
curses = [ 'windows-curses>=2.3; platform_system == "Windows"' ]
#The viewer in Jupyter (not included in "all", since it is only needed there):
jupyter = [ 'ipywidgets>=8.0', 'ipympl>=0.9' ]
all = [ 'matplotlib>=3.6', 'windows-curses>=2.3; platform_system == "Windows"' ]
#Conversion to scipp (MCPLFile.to_scipp), not included in "all" since scipp
#needs a more recent Python and numpy than the rest of mcpl-python:
scipp = [
  'scipp>=26.9; python_version >= "3.12" and platform_system != "FreeBSD"' ]

[project.urls]
"Homepage" = "https://mctools.github.io/mcpl/"
"Bug Tracker" = "https://github.com/mctools/mcpl/issues"

[project.scripts]
mcpltool = "mcpl._cli:main"
pymcpltool = "mcpl._cli:_main_pymcpltool"
